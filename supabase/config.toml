project_id = "make-anything-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

# Local `supabase db reset` runs this after migrations; db push does not.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openapi_url = "http://127.0.0.1"

# Local email testing server (Mailpit). The old [inbucket] section name is deprecated.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
# Large staff-managed product model and image uploads (bucket limits are unset).
file_size_limit = "524288000"

[auth]
enabled = true
site_url = "http://localhost:3000"
# OAuth redirects return to /auth/callback/ (trailing slash because the web app uses static export).
# Add your deployed origin here as well (for GitHub Pages, https://<user>.github.io/<repo>/**).
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/**",
  "https://*.e2b.app",
  "https://*.e2b.app/**",
  "https://*.github.io",
  "https://*.github.io/**",
  "https://davidy22.github.io/FA/**"
]
jwt_expiry = 3600
enable_signup = true
# Required for "connect a sign-in method" on the account page (supabase.auth.linkIdentity).
enable_manual_linking = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"
skip_nonce_check = false

[auth.external.facebook]
enabled = false
client_id = "env(SUPABASE_AUTH_FACEBOOK_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_FACEBOOK_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[auth.external.github]
enabled = false
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false

# Per-function JWT verification (the old global [functions] verify_jwt key no longer parses).
# Everything verifies except the Stripe webhook, which is called by Stripe directly.
[functions.bootstrap-admin]
verify_jwt = true

[functions.convert-document]
# Anonymous customers may convert a guest order document; the endpoint only
# accepts supported formats up to 20 MB and never stores the uploaded source.
verify_jwt = true

[functions.create-staff]
verify_jwt = true

[functions.set-user-active]
verify_jwt = true

[functions.refund-order]
verify_jwt = true

[functions.sign-file]
verify_jwt = true

[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false
