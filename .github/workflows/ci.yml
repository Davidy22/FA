name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/i18n-check.mjs
        working-directory: ${{ github.workspace }}
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://localhost' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon' }}

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Run supabase db start
        run: |
          set -o pipefail
          if ! supabase db start 2>&1 | tee db-start.log; then
            msg=$(tail -n 40 db-start.log | awk '{printf "%s%%0A", $0}')
            echo "::error::supabase db start failed (CLI $(supabase --version)) -- ${msg}"
            exit 1
          fi
      - name: Run supabase db reset
        run: |
          set -o pipefail
          if ! supabase db reset 2>&1 | tee db-reset.log; then
            msg=$(tail -n 40 db-reset.log | awk '{printf "%s%%0A", $0}')
            echo "::error::supabase db reset failed -- ${msg}"
            exit 1
          fi
      - name: Run supabase test db
        run: |
          set -o pipefail
          if ! supabase test db 2>&1 | tee db-test.log; then
            msg=$(grep -E "not ok|ERROR|Failure|failed" db-test.log | head -n 30 | awk '{printf "%s%%0A", $0}')
            [ -n "$msg" ] || msg=$(tail -n 40 db-test.log | awk '{printf "%s%%0A", $0}')
            echo "::error::supabase test db failed -- ${msg}"
            exit 1
          fi
